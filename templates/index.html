<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KopiTrace - AI & Blockchain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --coffee-dark: #3e2723; --coffee-light: #efebe9; --accent: #2e7d32; }
        body { background-color: var(--coffee-light); color: var(--coffee-dark); }
        .navbar { background-color: var(--coffee-dark) !important; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-coffee { background-color: var(--accent); color: white; border-radius: 25px; padding: 10px 25px; font-weight: bold; }
        .btn-coffee:hover { background-color: #1b5e20; color: white; }
        .table-container { background: white; border-radius: 15px; padding: 20px; margin-top: 30px; }
        #previewImg { max-width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
            <strong>KopiTrace</strong> <span class="badge bg-success" style="font-size: 0.6em;">Sepolia Testnet</span>
        </a>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card p-4">
                <h4 class="mb-4 text-center">Scan Kopi Baru</h4>
                <form id="uploadForm">
                    <div class="mb-3 text-start">
                        <label class="form-label">Batch ID</label>
                        <input type="text" id="batch_id" name="batch_id" class="form-control" placeholder="Contoh: KOPI-JKT-001" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label">Lokasi Gudang</label>
                        <input type="text" id="lokasi" name="lokasi" class="form-control" placeholder="Contoh: Gudang Bandung" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label">Foto Biji Kopi</label>
                        <input type="file" id="fileInput" name="file" class="form-control" accept="image/*" required onchange="previewImage(event)">
                        <img id="previewImg" alt="Preview">
                    </div>
                    <button type="submit" class="btn btn-coffee w-100 shadow-sm" id="btnSubmit">Scan & Catat ke Blockchain</button>
                </form>
            </div>
        </div>

        <div class="col-md-7">
            <div class="table-container shadow-sm">
                <h5 class="mb-4">Riwayat Deteksi Terkini</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Batch ID</th>
                                <th>Hasil AI</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        const output = document.getElementById('previewImg');
        reader.onload = function() {
            output.src = reader.result;
            output.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "⏳ Sedang Memproses...";
        btn.disabled = true;

        const formData = new FormData(e.target);
        try {
            const response = await fetch('/detect', { method: 'POST', body: formData });
            const data = await response.json();

            // Tambahkan baris baru ke tabel riwayat
            const table = document.getElementById('historyTable');
            const newRow = `
                <tr>
                    <td><strong>${data.batch_id}</strong></td>
                    <td><span class="badge bg-info text-dark">${data.hasil_ai}</span></td>
                    <td><span class="text-success">✅ Tersimpan</span></td>
                    <td><a href="https://sepolia.etherscan.io/tx/${data.tx_hash}" target="_blank" class="btn btn-sm btn-outline-primary">Cek Explorer</a></td>
                </tr>
            `;
            table.insertAdjacentHTML('afterbegin', newRow);
            
            alert("Berhasil! Data telah diamankan di Blockchain.");
            e.target.reset();
            document.getElementById('previewImg').style.display = 'none';
        } catch (err) {
            alert("Error: " + err);
        } finally {
            btn.innerText = "Scan & Catat ke Blockchain";
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
